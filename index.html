<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viktoria's Magical Birthday!</title>
    
    <!-- Playful Fonts for Kids -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* VIBRANT KIDS PALETTE */
            --bg-color: #e0f7fa; /* Light Cyan */
            --text-main: #4a148c; /* Deep Purple */
            --text-light: #7b1fa2; /* Lighter Purple */
            
            /* Rainbow Accents */
            --pink: #ff4081;
            --blue: #00b0ff;
            --yellow: #ffd740;
            --green: #69f0ae;
            --orange: #ffab40;
            
            --white: #ffffff;
            --overlay: rgba(74, 20, 140, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 64, 129, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 176, 255, 0.1) 0%, transparent 20%);
            color: var(--text-main);
            font-family: "Quicksand", sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ================================
           MUSIC CONTROL BUTTON
        ================================= */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--pink);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            animation: pulse 2s infinite;
        }

        .music-control:hover {
            transform: scale(1.1);
        }

        .music-control.muted {
            background: #ccc;
            animation: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 64, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 64, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 64, 129, 0); }
        }

        /* ================================
           UTILITIES & ANIMATIONS
        ================================= */
        .reveal {
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy effect */
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Floating Emojis Background */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            font-size: 2rem;
            opacity: 0.8;
            animation: rise 15s infinite ease-in;
            user-select: none;
        }

        @keyframes rise {
            0% { bottom: -100px; transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(50px) rotate(20deg); }
            100% { bottom: 110vh; transform: translateX(-50px) rotate(-20deg); opacity: 0; }
        }

        /* ================================
           INTRO (VIDEO)
        ================================= */
        .intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #4a148c, #7b1fa2); /* Fallback gradient */
            transition: opacity 1s ease, visibility 1s;
        }

        .intro-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .intro-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255, 64, 129, 0.3), rgba(74, 20, 140, 0.6));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .intro-content {
            color: var(--white);
            animation: popIn 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .intro-small {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: var(--yellow);
            font-weight: 700;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

            font-size: clamp(50px, 12vw, 12
